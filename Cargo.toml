[workspace]
members = ["factory", "machine", "squad", "mock-usdc"]
resolver = "2"

[workspace.dependencies]
near-sdk = { version = "5.29.0" }
borsh = "1.5.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
near-contract-standards = "5.1.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
overflow-checks = true
